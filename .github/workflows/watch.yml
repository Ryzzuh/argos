name: seat watch

# The schedule is DISABLED, and the reason is not a bug we can fix here.
#
# IMAX's site is behind Cloudflare, and the bearer token this needs is only
# available from a page render. A GitHub runner gets served a challenge instead
# of the page: the browser is real headless Chrome with a genuine TLS
# fingerprint, so the block is IP reputation, not client detection. Every
# datacenter host - any VPS included - will behave the same way.
#
# The residential connection this repo was written on works fine, so the
# monitor runs there via launchd instead. Re-enable the cron only if the token
# can be supplied from a machine on a residential IP.
on:
  workflow_dispatch:

# Never let two sweeps overlap: they would compete for the same API rate-limit
# window and throttle each other into failure.
concurrency:
  group: seat-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install dependencies
        run: |
          uv sync
          uv run playwright install --with-deps chromium

      - name: Check for released seats
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAX_STATE_DIR: state
          # The runner has no Google Chrome channel; use bundled Chromium.
          IMAX_BROWSER_CHANNEL: ""
        run: uv run python -m argos.cloud

      - name: Persist the diff baseline
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "argos"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "no change to persist"
          fi
